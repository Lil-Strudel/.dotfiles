[arch]
packages = [
    "go",
    "air-bin",
    "migrate-bin",
    { name = "rustup", hooks = { after_install = ["rustup", "default", "stable"] } },
    "terraform",
    "aws-cli-v2",
]

[mise]
packages = [
    { name = "node", options = { version = "lts" } },
    { name = "pnpm", options = { version = "latest" } },
]
