set -sg escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

%hidden in_app='#{m/r:^(n?vim|zsh|fzf)$,#{pane_current_command}}'
bind -n C-h if -F "$in_app" 'send C-h' 'select-pane -L'
bind -n C-j if -F "$in_app" 'send C-j' 'select-pane -D'
bind -n C-k if -F "$in_app" 'send C-k' 'select-pane -U'
bind -n C-l if -F "$in_app" 'send C-l' 'select-pane -R'

bind a display-popup -E -w 80% -h 80% 'workmux dashboard'
bind s display-popup -E -w 60% -h 60% 'sesh connect "$(sesh list | fzf --reverse --no-sort)"'

run-shell -b 'workmux sidebar on'

set -g status-position top
set -g status-style bg=default,fg=#625e5a
set -g status-left '#[fg=#{?client_prefix,#c4746e,#8ba4b0},bold]#S  '
set -g status-left-length 40
set -g status-right ''
set -g window-status-format '#I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, +,}'
set -g window-status-current-format '#[fg=#c5c9c5,bold]#I #W#{?@workmux_status, #{@workmux_status},}#{?window_zoomed_flag, +,}'
set -g window-status-separator '  '
set -g pane-border-style fg=#282727
set -g pane-active-border-style fg=#7fb4ca
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
set -g popup-border-style fg=#625e5a
set -g popup-border-lines rounded
set -g message-style bg=default,fg=#c4b28a
set -g mode-style bg=#223249,fg=#c5c9c5
